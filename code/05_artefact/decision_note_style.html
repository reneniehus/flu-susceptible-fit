<style>
  @page { size: A4; margin: 18mm 18mm 16mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Georgia", "Times New Roman", serif; color: #1b2129; font-size: 10.6pt;
         line-height: 1.42; max-width: 176mm; margin: 0 auto; }
  h1.title { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 15.5pt; line-height: 1.2;
